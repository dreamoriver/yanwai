name: Build APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSLo /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdline.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Read version
        id: ver
        run: |
          VERSION=$(sed -n 's/^versionName=//p' version.properties)
          CODE=$(sed -n 's/^versionCode=//p' version.properties)
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check changelog
        run: |
          grep -q "## ${{ steps.ver.outputs.name }}" CHANGELOG.md || {
            echo "::error::CHANGELOG.md 缺少 ## ${{ steps.ver.outputs.name }} 段落，Release 说明会挂旧内容";
            exit 1;
          }

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon -Pkotlin.compiler.execution.strategy=in-process

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk \
             "dist/yanwai-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yanwai-${{ steps.ver.outputs.name }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Check existing tag
        id: tag
        run: |
          if git ls-remote --tags origin "refs/tags/${{ steps.ver.outputs.tag }}" | grep -q .; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: 言外 ${{ steps.ver.outputs.name }}
          body_path: CHANGELOG.md
          files: dist/*.apk
          draft: false
          prerelease: false
